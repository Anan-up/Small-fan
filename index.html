<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#ffffff" />
<title>夏日清凉小风扇~</title>
<script>
  // 跟随系统深色模式
  (function () {
    if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
      document.documentElement.classList.add('dark')
    }
  })()
</script>
<style>
  :root {
    --fan-color: #333;
    --fan-bg-color: #fff;
  }
  html.dark {
    --fan-color: #fff;
    --fan-bg-color: #333;
    background: #121212;
  }

  * { margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: var(--fan-color);
    background: var(--fan-bg-color);
    transition: background .4s, color .4s;
    user-select: none;
    overflow-x: hidden;
  }

  .title { text-align: center; margin-top: 2rem; }
  .title h1 { font-size: 1.8rem; letter-spacing: .2rem; }
  .title p { margin-top: .6rem; opacity: .65; font-size: .95rem; letter-spacing: .1rem; }

  /* ================= 风扇主体 ================= */
  #fan {
    z-index: 4;
    width: 220px;
    height: 290px;
    margin: 2rem auto;
    position: relative;
  }

  /* 风扇头（外圈 + 网罩 + 中心盖） */
  #fan .fan-header {
    box-sizing: content-box;
    z-index: 1;
    border: solid 10px var(--fan-color);
    transform-origin: 50% calc(100% + 8px);
    border-radius: 50%;
    width: 220px;
    height: 220px;
    position: absolute;
    top: -10px;
    left: -10px;
  }
  /* 网罩纹理 */
  #fan .fan-header::before {
    content: "";
    z-index: 3;
    pointer-events: none;
    opacity: .28;
    background:
      radial-gradient(circle at center,
        transparent 0 32px, var(--fan-color) 33px 34px,
        transparent 35px 62px, var(--fan-color) 63px 64px,
        transparent 65px 92px, var(--fan-color) 93px 95px,
        transparent 96px),
      repeating-conic-gradient(from -1.5deg,
        var(--fan-color) 0deg 1.6deg, transparent 1.6deg 14deg);
    border-radius: 50%;
    position: absolute;
    inset: 10px;
  }
  /* 中心盖 */
  #fan .fan-header::after {
    content: "";
    z-index: 4;
    border: 6px solid var(--fan-color);
    background: var(--fan-bg-color);
    pointer-events: none;
    border-radius: 50%;
    width: 28px;
    height: 28px;
    position: absolute;
    top: 96px;
    left: 96px;
  }

  /* 扇叶组 */
  #fan .leafs {
    z-index: 2;
    transform-origin: 50%;
    width: 200px;
    height: 200px;
    position: absolute;
    top: 10px;
    left: 10px;
    will-change: transform;
  }
  #fan .leafs .circle {
    box-sizing: content-box;
    border: solid 8px var(--fan-color);
    border-radius: 50%;
    width: 10px;
    height: 10px;
    position: absolute;
    top: 87px;
    left: 87px;
  }
  #fan .leafs .leaf {
    box-sizing: content-box;
    border: 8px solid var(--fan-color);
    transform-origin: 0 0;
    border-radius: 20% 50%;
    width: 72px;
    height: 60px;
    position: absolute;
    top: 100px;
    left: 100px;
  }
  #fan .leafs .leaf-2 { transform: rotate(120deg); }
  #fan .leafs .leaf-3 { transform: rotate(240deg); }

  /* 脖子与底座 */
  #fan .fan-neck {
    background: var(--fan-color);
    z-index: 2;
    width: 10px;
    height: 60px;
    position: absolute;
    top: 228px;
    left: 105px;
  }
  #fan .fan-footer {
    background: var(--fan-color);
    z-index: 3;
    border-radius: 5%;
    width: 150px;
    height: 10px;
    position: absolute;
    top: 288px;
    left: 35px;
  }

  #fan .fan-header { will-change: transform; }

  /* ================= 控制按钮 ================= */
  .controls { display: flex; align-items: center; margin-bottom: 2rem; flex-wrap: wrap; justify-content: center; }
  .fan-btn {
    box-sizing: border-box;
    border: 2px solid var(--fan-color);
    border-bottom-width: .25rem;
    border-radius: 50%;
    width: 3rem;
    height: 3rem;
    margin: .5rem;
    display: inline-flex;
    justify-content: center;
    align-items: center;
    color: var(--fan-color);
    background: transparent;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    font-family: monospace;
    font-size: 1rem;
    font-weight: 700;
    transition: all .2s;
  }
  .fan-btn:hover { color: var(--fan-bg-color); background-color: var(--fan-color); }
  .fan-btn:focus-visible { outline: 3px solid var(--fan-color); outline-offset: .25rem; }
  .fan-btn.is-active, .fan-btn:active {
    color: var(--fan-bg-color);
    background-color: var(--fan-color);
    border-bottom-width: 1px;
    transform: translateY(.32rem);
  }
  .fan-btn.btn-sway { width: auto; border-radius: 1.5rem; padding: 0 .9rem; font-family: inherit; }

  footer { margin-bottom: 1.5rem; opacity: .5; font-size: .8rem; text-align: center; }
  footer a { color: inherit; }
</style>
</head>
<body>
  <div class="title">
    <h1>夏日清凉小风扇</h1>
    <p>除了没有风，什么都好！</p>
  </div>

  <div id="fan">
    <div class="fan-header">
      <div id="leafs" class="leafs">
        <div class="leaf leaf-1"></div>
        <div class="leaf leaf-2"></div>
        <div class="leaf leaf-3"></div>
        <div class="circle"></div>
      </div>
    </div>
    <div class="fan-neck"></div>
    <div class="fan-footer"></div>
  </div>

  <div class="controls">
    <button class="fan-btn is-active" data-speed="0" title="关闭风扇">关</button>
    <button class="fan-btn" data-speed="1" title="切换到一档风">1</button>
    <button class="fan-btn" data-speed="2" title="切换到二档风">2</button>
    <button class="fan-btn" data-speed="3" title="切换到三档风">3</button>
    <button class="fan-btn btn-sway is-active" id="swayBtn" title="摇头开关">摇头</button>
  </div>

  <footer>夏日小风扇 · 为你的夏日带去清凉</footer>

<script>
  const fan = document.getElementById('fan')
  const head = fan.querySelector('.fan-header')
  const leafs = document.getElementById('leafs')
  const buttons = document.querySelectorAll('.fan-btn[data-speed]')
  const swayBtn = document.getElementById('swayBtn')
  const fanSoundEl = document.getElementById('fanSound')
  const switchSound = document.getElementById('switchSound')

  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches

  let speed = 0
  let sway = true

  /* ============ 扇叶：带惯性的角速度模拟 ============
     各档目标角速度（度/秒），与原站每圈耗时一致：
     1 档 540°/s，2 档 720°/s，3 档 1350°/s */
  const speedMap = { 0: 0, 1: 540, 2: 720, 3: 1350 }
  let bladeAngle = 0      // 当前角度
  let bladeVel = 0        // 当前角速度
  // 加速快、减速慢（关机后扇叶靠惯性慢慢停下）
  const SPIN_UP_TAU = 0.9   // 加速时间常数（秒）
  const SPIN_DOWN_TAU = 2.2 // 减速时间常数（秒）

  /* ============ 摇头：幅度渐变 + 相位连续 ============ */
  const SWAY_PERIOD = 4.5   // 摇头周期（秒），比原站略慢更自然
  const SWAY_MAX_DEG = 5    // 最大摆角
  let swayPhase = -Math.PI / 2  // 从居中位置起步
  let swayAmp = 0               // 当前摆幅（平滑渐变）

  let lastTs = null
  function tick(ts) {
    if (lastTs === null) lastTs = ts
    const dt = Math.min((ts - lastTs) / 1000, 0.1) // 切后台回来时避免跳变
    lastTs = ts

    // 扇叶：一阶惯性趋近目标转速
    const targetVel = speedMap[speed]
    const tau = targetVel > bladeVel ? SPIN_UP_TAU : SPIN_DOWN_TAU
    bladeVel += (targetVel - bladeVel) * (1 - Math.exp(-dt / tau))
    if (targetVel === 0 && bladeVel < 1) bladeVel = 0
    bladeAngle = (bladeAngle + bladeVel * dt) % 360
    leafs.style.transform = `rotate(${bladeAngle}deg)`

    // 摇头：摆幅平滑趋近目标，相位持续推进，停下时自然回正
    const swaying = speed > 0 && sway && !reduceMotion
    const targetAmp = swaying ? SWAY_MAX_DEG : 0
    swayAmp += (targetAmp - swayAmp) * (1 - Math.exp(-dt / 0.8))
    if (swayAmp > 0.01) {
      swayPhase += dt * (Math.PI * 2 / SWAY_PERIOD)
      head.style.transform = `rotate(${swayAmp * Math.sin(swayPhase)}deg)`
    } else {
      head.style.transform = ''
    }

    requestAnimationFrame(tick)
  }
  requestAnimationFrame(tick)

  /* ============ 风扇音效：Web Audio 平滑过渡 ============
     换挡时音量、播放速率（音高）像真实电机一样渐变 */
  const gainMap = { 0: 0, 1: 0.3, 2: 0.6, 3: 1 }
  const rateMap = { 0: 1, 1: 0.85, 2: 1, 3: 1.15 }
  let audioCtx = null, fanGain = null, fanSource = null, audioReady = false

  async function initAudio() {
    if (audioCtx) return
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)()
      const buf = await (await fetch(fanSoundEl.src)).arrayBuffer()
      const audioBuf = await audioCtx.decodeAudioData(buf)
      fanGain = audioCtx.createGain()
      fanGain.gain.value = 0
      fanGain.connect(audioCtx.destination)
      fanSource = audioCtx.createBufferSource()
      fanSource.buffer = audioBuf
      fanSource.loop = true
      fanSource.connect(fanGain)
      fanSource.start()
      audioReady = true
      applyFanSound() // 解码完成后同步当前档位
    } catch (e) { /* 音频不可用时静默降级 */ }
  }

  function applyFanSound() {
    if (!audioReady) return
    const t = audioCtx.currentTime
    // setTargetAtTime：指数平滑趋近，避免音量/音高突变
    fanGain.gain.setTargetAtTime(gainMap[speed], t, 0.6)
    fanSource.playbackRate.setTargetAtTime(rateMap[speed], t, 0.8)
  }

  function playClick() {
    switchSound.currentTime = 0
    switchSound.volume = 0.6
    switchSound.play().catch(() => {})
  }

  /* ============ 交互 ============ */
  buttons.forEach(btn => {
    btn.addEventListener('click', () => {
      speed = Number(btn.dataset.speed)
      buttons.forEach(b => b.classList.toggle('is-active', b === btn))
      initAudio()
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume()
      playClick()
      applyFanSound()
    })
  })

  swayBtn.addEventListener('click', () => {
    sway = !sway
    swayBtn.classList.toggle('is-active', sway)
    playClick()
  })
</script>
